name: Deploy to home server

# Builds the images on GitHub, pushes them to GHCR tagged with the commit SHA, then asks the home server
# (Coolify, reached over Tailscale) to run exactly that SHA and waits for the result.
# Other branches named deploy/home-server only build and push images; the deploy job runs from main.
on:
  push:
    branches: [main, deploy/home-server]
    paths:
      - 'backend/**'
      - 'test_server/**'
      - 'bot/**'
      - 'frontend/**'
      - 'deploy/home/**'
      - '.github/workflows/deploy-home.yml'
  workflow_dispatch:

concurrency:
  group: deploy-home
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: test-server
            context: test_server
            dockerfile: test_server/Dockerfile
          - image: bot
            context: bot
            dockerfile: bot/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/financialwork-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/financialwork-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.SARA_TAILSCALE_IP }}
      - name: Trust only the pinned server host key
        env:
          SERVER: ${{ vars.SARA_TAILSCALE_IP }}
          HOST_KEY: ${{ vars.SARA_HOST_KEY }}
          DEPLOY_KEY: ${{ secrets.SARA_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s %s\n' "$SERVER" "$HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      # The key is restricted on the server to one forced command: sara-deploy --only financialwork.
      - name: Deploy ${{ github.sha }}
        env:
          SERVER: ${{ vars.SARA_TAILSCALE_IP }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            mark@"$SERVER" "financialwork $GITHUB_SHA"
      - name: Public smoke check
        env:
          HOST: ${{ vars.FINANCIALWORK_HOST }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://$HOST/login" | grep -q 'html'; then echo "https://$HOST is up"; exit 0; fi
            sleep 6
          done
          echo "public /login did not answer as expected"; exit 1
